<!DOCTYPE html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% comment %}On every page except the homepage, the browser tab shows the site name after the page title.{% endcomment %}
    <title>{{ page.title }}{% unless page.url == "/" %} - {{ site.title }}{% endunless %}</title>
    {% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
    <link rel="canonical" href="https://{{ site.domain }}{{ page.url }}">
    <link rel="stylesheet" href="/css/home.css">
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <a class="site-name" href="/">{{ site.title }}</a>
      </header>
      <main>
        {{ content }}
      </main>
      <footer class="site-footer">
        <nav aria-label="Site links">
          <a href="/support.html">Support</a>
        </nav>
      </footer>
    </div>
  </body>
</html>
